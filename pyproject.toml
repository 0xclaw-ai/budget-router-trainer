[project]
name = "oxclaw-budgetrouter-training"
version = "0.1.0"
description = "Dataset construction, splitting, training, and evaluation scripts for BudgetRouter"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [
    {name = "0xClaw Team"}
]
dependencies = [
    "pandas>=2.2",
    "pyarrow>=16",
    "numpy>=1.26",
    "tqdm>=4.66",
    "pyyaml>=6.0",
    "torch>=2.11.0",
    "transformers>=5.8.0",
    "accelerate>=1.13.0",
    "peft>=0.19.1",
    "safetensors>=0.7.0",
    "tensorboard>=2.17",
    "matplotlib>=3.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["scripts", "training", "config"]

[tool.hatch.build.targets.wheel.sources]
"scripts" = "budget_router_trainer/scripts"
"training" = "budget_router_trainer/training"
"config" = "budget_router_trainer/config"

[project.urls]
Repository = "https://github.com/0xclaw-ai/budget-router-trainer"
Runtime = "https://github.com/0xclaw-ai/budget-router"
